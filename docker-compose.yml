version: "3.8"

services:
  agritrace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agritrace-app
    ports:
      - "8000:8000"
    volumes:
      - agritrace_data:/app/data
    environment:
      - PORT=8000
      - DATA_DIR=/app/data
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  falkordb:
    image: falkordb/falkordb:latest
    container_name: agritrace-falkordb
    profiles:
      - with-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

volumes:
  agritrace_data:
  falkordb_data:
